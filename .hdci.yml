---
use_templates:
  - Charles546/honeydipper-ci@refs/heads/main:resources/hdci.tmpl.yml

settings:
  worker: podman_default

triggers:
  - conditions:
      relay_track: update-registry
      relay_sender:
        - Charles546/hd-driver-podman
        - Charles546/hd-driver-auth-github
        - Charles546/hd-driver-openai
    stages:
      - update-registry

stages:
  update-registry:
    jobs:
      - job_name: update-registry
        env:
          DRIVER_NAME: $relayed_data.driver_name,""
          MANIFEST_FILE: $relayed_data.manifest_file
          UPDATE_LATEST: '{{ .relayed_data.update_latest }}'
          UPDATE_CHANNEL: $relayed_data.update_channel
          VERSION: $relayed_data.version
          SHA256: $relayed_data.sha256
          ASSET_URL: $relayed_data.asset_url
          BINARY_NAME: $relayed_data.binary_name
        steps:
          - image: registry.gitlab.com/gitlab-ci-utils/curl-jq:latest
            run: |
              set -x
              if [ -z "$MANIFEST_FILE" ] || [ "$MANIFEST_FILE" == "null" ]; then
                echo "Error: manifest_file parameter is required"
                exit 1
              fi

              if [ ! -f "$MANIFEST_FILE" ]; then
                if [ -z "$DRIVER_NAME" ]; then
                  DRIVER_NAME=$(basename "$MANIFEST_FILE" | sed 's/\.json$//')
                fi
                cat <<EOF > "$MANIFEST_FILE"
              {
                "driver": "$DRIVER_NAME",
                "channels": {},
                "versions": {}
              }
              EOF
              fi

              echo "Updating registry with manifest: $MANIFEST_FILE, update_latest: $UPDATE_LATEST, update_channel: $UPDATE_CHANNEL"

              # Create artifact object
              ARTIFACT=$(jq -n \
                --arg os "linux" \
                --arg arch "amd64" \
                --arg url "$ASSET_URL" \
                --arg sha256 "$SHA256" \
                --arg binary_name "$BINARY_NAME" \
                '{os: $os, arch: $arch, url: $url, sha256: $sha256, fileName: $binary_name}')

              # Check if the version already exists in the manifest
              if jq -e --arg version "$VERSION" '.versions[$version]' "$MANIFEST_FILE" >/dev/null 2>&1; then
                echo "Version $VERSION already exists in the manifest, updating artifact..."
                jq --arg version "$VERSION" --argjson artifact "$ARTIFACT" \
                  '.versions[$version].artifacts |= ([$artifact] + [.[] | select(.os != "linux" or .arch != "amd64")])' \
                  "$MANIFEST_FILE" > tmp_manifest.json && mv tmp_manifest.json "$MANIFEST_FILE"
              else
                echo "Version $VERSION does not exist in the manifest, creating new version..."
                jq --arg version "$VERSION" --argjson artifact "$ARTIFACT" \
                  '.versions[$version] = {artifacts: [$artifact]}' \
                  "$MANIFEST_FILE" > tmp_manifest.json && mv tmp_manifest.json "$MANIFEST_FILE"
              fi

              if [ "$UPDATE_LATEST" == "true" ]; then
                echo "Updating latest version to $VERSION"
                jq --arg version "$VERSION" '.latest = $version' "$MANIFEST_FILE" > tmp_manifest.json && mv tmp_manifest.json "$MANIFEST_FILE"
              fi

              if [ -n "$UPDATE_CHANNEL" ] && [ "$UPDATE_CHANNEL" != "null" ]; then
                echo "Updating channel $UPDATE_CHANNEL to version $VERSION"
                jq --arg version "$VERSION" --arg channel "$UPDATE_CHANNEL" \
                  '.channels[$channel] = $version' "$MANIFEST_FILE" > tmp_manifest.json && mv tmp_manifest.json "$MANIFEST_FILE"
              fi
          - executor: gh
            env:
              GH_TOKEN: hd-lookup:github_write_pat
            run: |
              if git diff --quiet "$MANIFEST_FILE"; then
                echo "No changes to commit"
                exit 0
              fi

              git config --global user.name "HoneyDipper CI"
              git config --global user.email "honeydipper-ci@example.com"
              git add "$MANIFEST_FILE"
              git commit -m "Update manifest $MANIFEST_FILE for version $VERSION" -a
              git push origin HEAD:main
